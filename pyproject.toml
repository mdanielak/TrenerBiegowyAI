[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trener-biegowy-ai"
version = "0.4.1"
description = "Lokalne narzędzie do synchronizacji danych GarminDB, analizy gotowości i zarządzania treningami Garmin."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Maciej" }
]
dependencies = [
    "garmindb>=3.9,<4",
    "garminconnect>=0.3.11",
    "pydantic>=2.0",
    "openai>=1.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
    "Pillow>=10",
]

[project.scripts]
trainer = "trainer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trainer*", "services*", "api*", "ai*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # garmindb -> idbutils still uses the SQLAlchemy 1.x declarative_base import
    'ignore:The ``declarative_base\(\)`` function is now available:DeprecationWarning:idbutils\..*',
]
