<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trener Biegowy{% endblock %}</title>
  {% block head_extra %}{% endblock %}
  {% include "_styles.html" %}
</head>
<body>
{% import "_icons.html" as ico %}
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">{{ ico.runner(19) }}</span>
      <span>
        <span class="brand-name">Trener Biegowy</span>
        <span class="brand-sub">Dane z Twojego zegarka</span>
      </span>
    </div>

    <nav class="nav" aria-label="Nawigacja główna">
      <span class="nav-label">Widoki</span>

      <a class="nav-item{% if active_nav == 'today' %} active{% endif %}" href="/"{% if active_nav == 'today' %} aria-current="page"{% endif %}>
        <img class="asset" src="/assets/01_navigation/home.png" width="34" height="34" alt=""><span>Strona główna</span>
      </a>

      <a class="nav-item{% if active_nav == 'plan' %} active{% endif %}" href="/plan"{% if active_nav == 'plan' %} aria-current="page"{% endif %}>
        <img class="asset" src="/assets/01_navigation/plan.png" width="34" height="34" alt=""><span>Plan treningowy</span>
      </a>

      <a class="nav-item{% if active_nav == 'week' %} active{% endif %}" href="/week"{% if active_nav == 'week' %} aria-current="page"{% endif %}>
        <img class="asset" src="/assets/01_navigation/calendar.png" width="34" height="34" alt=""><span>Kalendarz</span>
      </a>

      <a class="nav-item{% if active_nav == 'stats' %} active{% endif %}" href="/stats"{% if active_nav == 'stats' %} aria-current="page"{% endif %}>
        <img class="asset" src="/assets/01_navigation/statistics.png" width="34" height="34" alt=""><span>Statystyki</span>
      </a>

      <a class="nav-item{% if active_nav == 'analysis' %} active{% endif %}" href="/analysis"{% if active_nav == 'analysis' %} aria-current="page"{% endif %}>
        <img class="asset" src="/assets/01_navigation/analysis.png" width="34" height="34" alt=""><span>Analiza</span>
      </a>

      <a class="nav-item{% if active_nav == 'journal' %} active{% endif %}" href="/journal"{% if active_nav == 'journal' %} aria-current="page"{% endif %}>
        <img class="asset" src="/assets/07_ui_icons/plan.png" width="34" height="34" alt=""><span>Dziennik</span>
      </a>

      <a class="nav-item{% if active_nav == 'goal' %} active{% endif %}" href="/goal"{% if active_nav == 'goal' %} aria-current="page"{% endif %}>
        <img class="asset" src="/assets/03_activity/trail_run.png" width="34" height="34" alt=""><span>Cel</span>
      </a>

      <a class="nav-item{% if active_nav == 'settings' %} active{% endif %}" href="/settings"{% if active_nav == 'settings' %} aria-current="page"{% endif %}>
        <img class="asset" src="/assets/01_navigation/settings.png" width="34" height="34" alt=""><span>Ustawienia</span>
      </a>
    </nav>

  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

</div>
</body>
</html>
