<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Synchronizacja danych</title>{% if job.status in ('accepted', 'running') %}<meta http-equiv="refresh" content="15">{% endif %}<style>:root { font-family: system-ui, sans-serif; color:#1d2939; background:#f5f7fa; } body { margin:0; padding:28px 16px; } main { max-width:700px; margin:auto; background:#fff; padding:18px; border-radius:10px; box-shadow:0 1px 3px #1018281a; } .failed { color:#8a1c1c; } .succeeded { color:#17663e; } .unknown { color:#8a5a00; }</style></head><body><main><h1>Synchronizacja danych</h1><p class="{{ job.status }}">{{ message }}</p>{% if job.status == 'failed' and job.error_message %}<p>{{ job.error_message }}</p>{% endif %}<p><a href="/">Wróć do widoku dnia</a></p></main></body></html>
